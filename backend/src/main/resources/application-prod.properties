# ===================================================================
# PROJECTKIT SPRING BOOT PRODUCTION PROFILE (Render / Railway / Cloud)
# ===================================================================

spring.application.name=projectkit-backend

# -------------------------------------------------------------------
# Server & Port Binding (Dynamically provided by Render / Cloud Run $PORT)
# -------------------------------------------------------------------
server.port=${PORT:8081}
server.error.include-message=never
server.error.include-stacktrace=never
server.error.include-binding-errors=never

# -------------------------------------------------------------------
# Production Managed MySQL Database (AWS RDS / PlanetScale / DigitalOcean / Aiven)
# -------------------------------------------------------------------
# Enforce SSL/TLS encryption for remote managed database connections
spring.datasource.url=${DB_URL:jdbc:mysql://localhost:3306/projectkit_db}?sslMode=REQUIRED&useSSL=true&requireSSL=true&serverTimezone=UTC&allowPublicKeyRetrieval=true
spring.datasource.username=${DB_USERNAME}
spring.datasource.password=${DB_PASSWORD}
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

# HikariCP Production Connection Pool
spring.datasource.hikari.maximum-pool-size=20
spring.datasource.hikari.minimum-idle=5
spring.datasource.hikari.idle-timeout=30000
spring.datasource.hikari.connection-timeout=20000
spring.datasource.hikari.max-lifetime=1800000
spring.datasource.hikari.pool-name=ProjectKitHikariPool

# -------------------------------------------------------------------
# JPA / Hibernate ORM (Schema managed via Flyway migrations)
# -------------------------------------------------------------------
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.format_sql=false
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.MySQLDialect
spring.jpa.open-in-view=false

# -------------------------------------------------------------------
# Flyway Database Migration
# -------------------------------------------------------------------
spring.flyway.enabled=true
spring.flyway.baseline-on-migrate=true
spring.flyway.baseline-version=0
spring.flyway.locations=classpath:db/migration

# -------------------------------------------------------------------
# JWT Security Tokens
# -------------------------------------------------------------------
projectkit.jwt.secret=${JWT_SECRET}
projectkit.jwt.expiration-ms=${JWT_EXPIRATION_MS:86400000}
projectkit.jwt.refresh-expiration-ms=${JWT_REFRESH_EXPIRATION_MS:604800000}

# -------------------------------------------------------------------
# Razorpay Production Payment Gateway
# -------------------------------------------------------------------
projectkit.razorpay.key-id=${RAZORPAY_KEY_ID}
projectkit.razorpay.key-secret=${RAZORPAY_KEY_SECRET}
projectkit.razorpay.webhook-secret=${RAZORPAY_WEBHOOK_SECRET}
projectkit.payments.allow-simulation=false

# -------------------------------------------------------------------
# Persistent Storage (Private mounted disk or S3 compatible bucket)
# -------------------------------------------------------------------
projectkit.storage.upload-dir=${STORAGE_DIR:/var/data/projectkit/uploads}
spring.servlet.multipart.max-file-size=50MB
spring.servlet.multipart.max-request-size=50MB

# -------------------------------------------------------------------
# Production CORS (Netlify Frontend Domain)
# -------------------------------------------------------------------
projectkit.cors.allowed-origins=${FRONTEND_URL:https://projectkit.in,https://projectkit.netlify.app}

# -------------------------------------------------------------------
# Production Mail Gateway (SendGrid / AWS SES)
# -------------------------------------------------------------------
spring.mail.host=${SMTP_HOST:smtp.sendgrid.net}
spring.mail.port=${SMTP_PORT:587}
spring.mail.username=${SMTP_USERNAME}
spring.mail.password=${SMTP_PASSWORD}
spring.mail.properties.mail.smtp.auth=true
spring.mail.properties.mail.smtp.starttls.enable=true
spring.mail.properties.mail.smtp.starttls.required=true
projectkit.mail.enabled=true
projectkit.mail.from-address=${PROJECTKIT_MAIL_FROM:noreply@projectkit.in}
projectkit.mail.from-name=${PROJECTKIT_MAIL_NAME:ProjectKit Marketplace}
projectkit.mail.frontend-url=${FRONTEND_URL:https://projectkit.in}

# -------------------------------------------------------------------
# Logging Levels (Clean, audit-friendly, never logs secrets)
# -------------------------------------------------------------------
logging.level.root=INFO
logging.level.com.projectkit=INFO
logging.level.org.springframework.security=WARN
logging.level.org.hibernate.SQL=WARN
logging.level.org.hibernate.type.descriptor.sql=WARN
