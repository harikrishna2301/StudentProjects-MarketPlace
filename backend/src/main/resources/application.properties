# ===================================================================
# PROJECTKIT BACKEND CONFIGURATION
# Spring Boot 3.2.x | Java 17 | MySQL 8 | Spring Security 6
# ===================================================================

spring.application.name=projectkit-backend

# -------------------------------------------------------------------
# Server Configuration
# -------------------------------------------------------------------
server.port=8081
server.error.include-message=never
server.error.include-stacktrace=never

# -------------------------------------------------------------------
# MySQL Database Connection (Environment Variables with Local Fallbacks)
# -------------------------------------------------------------------
spring.datasource.url=${DB_URL:jdbc:mysql://localhost:3306/projectkit_db?createDatabaseIfNotExist=true&useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=UTC}
spring.datasource.username=${DB_USERNAME:root}
spring.datasource.password=${DB_PASSWORD:}
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

# HikariCP Connection Pool Settings
spring.datasource.hikari.maximum-pool-size=10
spring.datasource.hikari.minimum-idle=5
spring.datasource.hikari.idle-timeout=30000
spring.datasource.hikari.connection-timeout=20000
spring.datasource.hikari.max-lifetime=1800000

# -------------------------------------------------------------------
# Spring Data JPA & Hibernate ORM
# -------------------------------------------------------------------
# Managed by Flyway: validate entity mappings against migration tables
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.MySQLDialect
spring.jpa.open-in-view=false

# -------------------------------------------------------------------
# Flyway Database Migration
# -------------------------------------------------------------------
spring.flyway.enabled=true
spring.flyway.baseline-on-migrate=true
spring.flyway.baseline-version=0
spring.flyway.locations=classpath:db/migration

# -------------------------------------------------------------------
# JWT Security Configuration
# -------------------------------------------------------------------
# Minimum 256-bit secure key for HS256 / HS384 algorithms
projectkit.jwt.secret=${JWT_SECRET:9a4f2c8d3b7a1e6f5c8d2e4a7b9c1d3e5f7a9b1c3d5e7f9a1b3c5d7e9f1a3b5c}
# 24 hours access token validity (in milliseconds)
projectkit.jwt.expiration-ms=86400000
# 7 days refresh token validity (in milliseconds)
projectkit.jwt.refresh-expiration-ms=604800000

# -------------------------------------------------------------------
# Razorpay Payment Gateway Configuration
# -------------------------------------------------------------------
projectkit.razorpay.key-id=${RAZORPAY_KEY_ID:rzp_test_placeholder_key}
projectkit.razorpay.key-secret=${RAZORPAY_KEY_SECRET:placeholder_secret}
projectkit.razorpay.webhook-secret=${RAZORPAY_WEBHOOK_SECRET:placeholder_webhook_secret}

# -------------------------------------------------------------------
# File Upload & Secure Storage Configuration
# -------------------------------------------------------------------
# Physical private folder outside public web root
projectkit.storage.upload-dir=./uploads
spring.servlet.multipart.enabled=true
spring.servlet.multipart.max-file-size=50MB
spring.servlet.multipart.max-request-size=50MB

# -------------------------------------------------------------------
# CORS Configuration (React Frontend Development & Production Origins)
# -------------------------------------------------------------------
projectkit.cors.allowed-origins=${FRONTEND_URL:http://localhost:5173,http://localhost:3000}

# -------------------------------------------------------------------
# Springdoc OpenAPI 3 / Swagger UI Documentation
# -------------------------------------------------------------------
springdoc.api-docs.path=/api-docs
springdoc.swagger-ui.path=/swagger-ui.html
springdoc.swagger-ui.operations-sorter=method
springdoc.swagger-ui.tags-sorter=alpha

# -------------------------------------------------------------------
# Logging Configuration
# -------------------------------------------------------------------
logging.level.root=INFO
logging.level.com.projectkit=DEBUG
logging.level.org.springframework.security=INFO
logging.level.org.hibernate.SQL=DEBUG
logging.level.org.hibernate.type.descriptor.sql.BasicBinder=TRACE

# -------------------------------------------------------------------
# Transactional Email Provider Configuration (SMTP / AWS SES / SendGrid)
# -------------------------------------------------------------------
spring.mail.host=${SMTP_HOST:smtp.sendgrid.net}
spring.mail.port=${SMTP_PORT:587}
spring.mail.username=${SMTP_USERNAME:}
spring.mail.password=${SMTP_PASSWORD:}
spring.mail.properties.mail.smtp.auth=true
spring.mail.properties.mail.smtp.starttls.enable=true
spring.mail.properties.mail.smtp.starttls.required=true
spring.mail.properties.mail.smtp.connectiontimeout=5000
spring.mail.properties.mail.smtp.timeout=5000
spring.mail.properties.mail.smtp.writetimeout=5000

projectkit.mail.enabled=${PROJECTKIT_MAIL_ENABLED:true}
projectkit.mail.from-address=${PROJECTKIT_MAIL_FROM:noreply@projectkit.in}
projectkit.mail.from-name=${PROJECTKIT_MAIL_NAME:ProjectKit Marketplace}
projectkit.mail.frontend-url=${FRONTEND_URL:http://localhost:3000}

