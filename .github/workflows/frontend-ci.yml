name: Frontend CI / CD Pipeline

on:
  push:
    branches: [ main, develop ]
    paths:
      - 'src/**'
      - 'public/**'
      - 'index.html'
      - 'package.json'
      - 'package-lock.json'
      - 'tsconfig*.json'
      - 'vite.config.ts'
      - '.github/workflows/frontend-ci.yml'
  pull_request:
    branches: [ main, develop ]
    paths:
      - 'src/**'
      - 'public/**'
      - 'index.html'
      - 'package.json'
      - 'package-lock.json'
      - 'tsconfig*.json'
      - 'vite.config.ts'
      - '.github/workflows/frontend-ci.yml'

jobs:
  lint-and-build:
    name: Node.js 20 Lint, Typecheck & Production Build
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code Repository
        uses: actions/checkout@v4

      - name: Set up Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'
          cache-dependency-path: package-lock.json

      - name: Install Dependencies
        run: npm ci

      - name: Run TypeScript & ESLint Verification
        run: npm run lint

      - name: Run Vite Production Build
        run: npm run build
        env:
          VITE_API_BASE_URL: https://api.projectkit.in
          VITE_RAZORPAY_KEY_ID: rzp_test_placeholder_key

      - name: Archive Web Distribution Artifact
        uses: actions/upload-artifact@v4
        with:
          name: projectkit-frontend-dist
          path: dist/
          retention-days: 7
